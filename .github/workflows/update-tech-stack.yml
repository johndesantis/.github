name: Update Technology Stack

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tech-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update README tech stack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import os, json, urllib.request, re, urllib.parse

          token = os.environ['GITHUB_TOKEN']
          org = 'LoBot-LLC'
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def api(path):
              url = f'https://api.github.com{path}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          def api_paginated(path):
              results = []
              page = 1
              while True:
                  data = api(f'{path}?per_page=100&page={page}')
                  if not data:
                      break
                  results.extend(data)
                  if len(data) < 100:
                      break
                  page += 1
              return results

          repos = api_paginated(f'/orgs/{org}/repos')

          lang_bytes = {}
          for repo in repos:
              if repo.get('fork') or repo.get('archived'):
                  continue
              try:
                  langs = api(f"/repos/{org}/{repo['name']}/languages")
              except Exception:
                  continue
              for lang, count in langs.items():
                  lang_bytes[lang] = lang_bytes.get(lang, 0) + count

          colors = {
              'TypeScript': '3178C6', 'JavaScript': 'F7DF1E', 'Python': '3776AB',
              'Go': '00ADD8', 'Rust': 'DEA584', 'Java': 'ED8B00', 'C': '555555',
              'C++': 'F34B7D', 'C#': '178600', 'Ruby': 'CC342D', 'PHP': '777BB4',
              'Swift': 'F05138', 'Kotlin': 'A97BFF', 'HTML': 'E34F26',
              'CSS': '1572B6', 'SCSS': 'C6538C', 'Shell': '89E051', 'Dockerfile': '384D54',
              'YAML': 'CB171E', 'JSON': '000000', 'Markdown': '000000',
              'Vue': '4FC08D', 'Svelte': 'FF3E00', 'Dart': '0175C2',
              'Lua': '000080', 'R': '276DC3', 'Scala': 'DC322F', 'Elixir': '4E2A8E',
              'Haskell': '5E5086', 'Perl': '39457E',
          }

          logo_map = {
              'TypeScript': 'typescript', 'JavaScript': 'javascript', 'Python': 'python',
              'Go': 'go', 'Rust': 'rust', 'Java': 'java', 'C': 'c', 'C++': 'cplusplus',
              'Ruby': 'ruby', 'PHP': 'php', 'Swift': 'swift',
              'Kotlin': 'kotlin', 'HTML': 'html5', 'CSS': 'css3', 'SCSS': 'sass',
              'Shell': 'gnubash', 'Dockerfile': 'docker', 'YAML': 'yaml', 'JSON': 'json',
              'Markdown': 'markdown', 'Vue': 'vuejs', 'Svelte': 'svelte', 'Dart': 'dart',
              'Lua': 'lua', 'R': 'r', 'Scala': 'scala', 'Elixir': 'elixir',
              'Haskell': 'haskell', 'Perl': 'perl',
          }

          def logo(lang):
              slug = logo_map.get(lang)
              if slug is None:
                  return ''
              return slug

          badges = []
          for lang, count in sorted(lang_bytes.items(), key=lambda x: -x[1]):
              color = colors.get(lang, '858585')
              lg = logo(lang)
              if lg:
                  badge = f'<img src="https://img.shields.io/badge/-{urllib.parse.quote(lang)}-{color}?logo={lg}&logoColor=white" alt="{lang}" />'
              else:
                  badge = f'<img src="https://img.shields.io/badge/-{urllib.parse.quote(lang)}-{color}" alt="{lang}" />'
              badges.append(badge)

          block = '<div align="left">\n  ' + '\n  '.join(badges) + '\n</div>'

          with open('README.md') as f:
              content = f.read()

          pattern = re.compile(r'<!-- TECH-STACK-START -->.*?<!-- TECH-STACK-END -->', re.DOTALL)
          new_content = pattern.sub(f'<!-- TECH-STACK-START -->\n{block}\n<!-- TECH-STACK-END -->', content)

          with open('README.md', 'w') as f:
              f.write(new_content)

          print(f'Updated with {len(badges)} languages')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update technology stack badges"
            git push
          fi
